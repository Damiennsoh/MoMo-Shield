[global]
type=global
user_agent=MoMo-Shield-Synthetic-Demo

[udp-transport]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=__ASTERISK_MEDIA_IP__
external_media_address=__ASTERISK_MEDIA_IP__
; Docker bridge subnet only. The handset is on the host's Wi-Fi LAN and uses
; the external media address above, rather than an unreachable container IP.
local_net=172.16.0.0/12

[softphone-auth]
type=auth
auth_type=userpass
username=200
password=__ASTERISK_SIP_PASSWORD__

[200]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

[200]
type=endpoint
transport=udp-transport
context=demo-softphone
disallow=all
allow=ulaw,alaw
auth=softphone-auth
aors=200
callerid=MoMo Shield Demo <200>
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
