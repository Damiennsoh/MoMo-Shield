[momo-demo-outbound]
; The app originates only PJSIP/200 into this local, fixed demo context.
; Keep an answered call silent and open briefly. FraudOps terminates it on
; the same event that raises the handset warning and simulated hold.
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=300)
 same => n,Wait(300)
 same => n,Hangup()

[demo-softphone]
; Harmless test extension for the registered softphone. No outbound dialing.
exten => 700,1,Answer()
 same => n,Playback(beep)
 same => n,Hangup()
