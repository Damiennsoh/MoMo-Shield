[momo-demo-outbound]
; The app originates only PJSIP/200 into this local, fixed demo context.
; Once answered, try the optional human-recorded Ghana-context WAV. If no
; clip is installed, play a simple beep and end the call safely.
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=45)
 same => n,TryExec(Playback(custom/momo-warning))
 same => n,GotoIf($["${TRYSTATUS}" = "SUCCESS"]?done)
 same => n,Playback(beep)
 same => n(done),Hangup()

[demo-softphone]
; Harmless test extension for the registered softphone. No outbound dialing.
exten => 700,1,Answer()
 same => n,Playback(beep)
 same => n,Hangup()
