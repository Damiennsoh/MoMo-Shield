name: Build AndroidShield APK

on:
  push:
    branches: [main]
    paths:
      - "MoMo-Shield-2/AndroidShield/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MoMo-Shield-2/AndroidShield

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: momoshield-debug-apk
          path: MoMo-Shield-2/AndroidShield/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
