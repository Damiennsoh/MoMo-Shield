services:
  asterisk:
    build:
      context: ./demo/asterisk
      dockerfile: Dockerfile
    environment:
      ASTERISK_SIP_PASSWORD: ${ASTERISK_SIP_PASSWORD:?Set a strong local demo password in .env.demo}
      ASTERISK_ARI_USERNAME: ${ASTERISK_ARI_USERNAME:-momoshield}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:?Set a strong local ARI password in .env.demo}
      ASTERISK_MEDIA_IP: ${ASTERISK_MEDIA_IP:?Set to the host LAN IPv4 address in .env.demo}
    ports:
      - "${DEMO_LAN_IP:-127.0.0.1}:5060:5060/udp"
      - "${DEMO_LAN_IP:-127.0.0.1}:10000-10050:10000-10050/udp"
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-7}
      DEMO_DEVICE_TOKEN: ${DEMO_DEVICE_TOKEN:?Generate a random DEMO_DEVICE_TOKEN in .env.demo}
      DEMO_DEVICE_AUDIO_DIR: /app/frontend-assets
      ASTERISK_ARI_URL: http://asterisk:8088/ari
      ASTERISK_ARI_USERNAME: ${ASTERISK_ARI_USERNAME:-momoshield}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:?Set a strong local ARI password in .env.demo}
    ports:
      - "${DEMO_LAN_IP:-127.0.0.1}:8000:8000"
    volumes:
      - ./frontend/assets:/app/frontend-assets:ro
    depends_on:
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_API_URL: http://backend:8000
      DEMO_DEVICE_TOKEN: ${DEMO_DEVICE_TOKEN:?Generate a random DEMO_DEVICE_TOKEN in .env.demo}
      DEMO_DEVICE_URL: http://${DEMO_LAN_IP:-127.0.0.1}:8000/api/v1/demo-device#token=${DEMO_DEVICE_TOKEN}
    ports:
      - "${DEMO_LAN_IP:-127.0.0.1}:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
